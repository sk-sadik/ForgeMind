# ForgeMind model router configuration.
#
# Each agent role maps to an ORDERED LIST of LiteLLM model strings
# (provider/model) — the fallback chain. structured_call tries them in
# order and moves to the next on billing/auth/rate-limit/model-not-found/
# connection errors; if all fail it raises LLMUnavailableError listing each
# model and its error.
# Supported providers: anthropic, openai, ollama (and anything LiteLLM supports).
#
# Models verified against GET /v1/models for the configured key.
# NOTE: claude-sonnet-4-20250514 (the original default) is NOT available to
# this key — do not restore it.
#
# Temperature: the 5.5 family (sonnet-5-5 / haiku-5-5) accepts ONLY
# temperature=1 (verified via litellm param validation); sampling control on
# those roles comes from prompts. The critic uses claude-sonnet-4-6, which
# supports real temperatures. Router also sets litellm.drop_params=True as a
# safety net.
#
# cheap_mode: when true (or FORGEMIND_CHEAP_MODE=1), the high-volume roles
# listed in cheap_roles are pointed at cheap_model FIRST (original chain
# stays as fallback). Use cheap_model: ollama/llama3.1:8b for a free local
# option (requires `ollama serve`).

defaults:
  temperature: 1.0
  max_tokens: 2048
  input_cost_per_mtok: 0.0
  output_cost_per_mtok: 0.0

cheap_mode: false
cheap_model: anthropic/claude-haiku-5-5
cheap_roles:
  - scout
  - novelty
  - taste_learner

roles:
  # Reasoning model: adaptive interview, synthesis, planning.
  interviewer:
    models:
      - anthropic/claude-sonnet-5-5
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-haiku-5-5
    temperature: 1.0
    max_tokens: 1500
    # pricing estimated for cost logging (verify against console.anthropic.com)
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  # Research sweep (high volume: cheap tier).
  scout:
    models:
      - anthropic/claude-haiku-5-5
      - anthropic/claude-sonnet-5-5
    temperature: 1.0
    max_tokens: 3000
    input_cost_per_mtok: 1.0
    output_cost_per_mtok: 5.0

  # Generators: three styles (prompt-driven diversity; temperature is
  # locked to 1 on the 5.5 family).
  generator_impact:
    models:
      - anthropic/claude-sonnet-5-5
      - anthropic/claude-sonnet-4-6
    temperature: 1.0
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  generator_technical:
    models:
      - anthropic/claude-haiku-5-5
      - anthropic/claude-sonnet-5-5
    temperature: 1.0
    input_cost_per_mtok: 1.0
    output_cost_per_mtok: 5.0

  generator_fusion:
    models:
      - anthropic/claude-sonnet-5-5
      - anthropic/claude-sonnet-4-6
    temperature: 1.0
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  # Evaluation (cheap tier, temperature locked to 1 on haiku-5-5).
  novelty:
    models:
      - anthropic/claude-haiku-5-5
      - anthropic/claude-sonnet-5-5
    temperature: 1.0
    input_cost_per_mtok: 1.0
    output_cost_per_mtok: 5.0

  feasibility:
    models:
      - anthropic/claude-haiku-5-5
      - anthropic/claude-sonnet-5-5
    temperature: 1.0
    input_cost_per_mtok: 1.0
    output_cost_per_mtok: 5.0

  # Critic must NOT share a PRIMARY model with any generator (enforced by
  # tests): claude-sonnet-4-6 differs from both sonnet-5-5 and haiku-5-5
  # generators AND supports real (low) temperatures for tight critique.
  critic:
    models:
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-sonnet-5-5
    temperature: 0.3
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  ranker:
    models:
      - anthropic/claude-sonnet-5-5
      - anthropic/claude-sonnet-4-6
    temperature: 1.0
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  taste_learner:
    models:
      - anthropic/claude-haiku-5-5
      - anthropic/claude-sonnet-5-5
    temperature: 1.0
    input_cost_per_mtok: 1.0
    output_cost_per_mtok: 5.0

  copilot:
    models:
      - anthropic/claude-sonnet-5-5
      - anthropic/claude-sonnet-4-6
    temperature: 1.0
    max_tokens: 6000
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0
