# ForgeMind model router configuration.
#
# Each agent role maps to a LiteLLM model string (provider/model) plus
# pricing used for per-call cost logging (USD per 1M tokens).
# Supported providers: anthropic, openai, ollama (and anything LiteLLM supports).

defaults:
  temperature: 0.4
  max_tokens: 2048
  input_cost_per_mtok: 0.0
  output_cost_per_mtok: 0.0

roles:
  # Reasoning model: adaptive interview, synthesis, planning.
  interviewer:
    model: anthropic/claude-sonnet-4-20250514
    temperature: 0.5
    max_tokens: 1500
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  # Fast/cheap: tool-driven research sweep.
  scout:
    model: openai/gpt-4o-mini
    temperature: 0.2
    max_tokens: 3000
    input_cost_per_mtok: 0.15
    output_cost_per_mtok: 0.60

  # Generators: three styles, two different models for diversity.
  generator_impact:
    model: anthropic/claude-sonnet-4-20250514
    temperature: 0.8
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  generator_technical:
    model: openai/gpt-4o-mini
    temperature: 0.8
    input_cost_per_mtok: 0.15
    output_cost_per_mtok: 0.60

  generator_fusion:
    model: ollama/llama3.1:8b
    temperature: 0.9
    input_cost_per_mtok: 0.0
    output_cost_per_mtok: 0.0

  # Evaluation: deliberately different models from the generators.
  novelty:
    model: openai/gpt-4o-mini
    temperature: 0.1
    input_cost_per_mtok: 0.15
    output_cost_per_mtok: 0.60

  feasibility:
    model: ollama/llama3.1:8b
    temperature: 0.2
    input_cost_per_mtok: 0.0
    output_cost_per_mtok: 0.0

  # Critic must NOT share a model with any generator.
  critic:
    model: openai/gpt-4o
    temperature: 0.3
    input_cost_per_mtok: 2.50
    output_cost_per_mtok: 10.0

  ranker:
    model: anthropic/claude-sonnet-4-20250514
    temperature: 0.2
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0

  taste_learner:
    model: openai/gpt-4o-mini
    temperature: 0.2
    input_cost_per_mtok: 0.15
    output_cost_per_mtok: 0.60

  copilot:
    model: anthropic/claude-sonnet-4-20250514
    temperature: 0.5
    max_tokens: 6000
    input_cost_per_mtok: 3.0
    output_cost_per_mtok: 15.0
