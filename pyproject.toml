[project]
name = "forgemind"
version = "0.1.0"
description = "Multi-agent system that suggests validated project problem statements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "litellm>=1.40",
    "langgraph>=0.2",
    "httpx>=0.27",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "sqlmodel>=0.0.19",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
